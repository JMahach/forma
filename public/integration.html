<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Интеграция · Форма 1</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/integration.css">
</head>
<body class="integration-lab">
<header class="lab-heading"><strong>Интеграция</strong><output id="caseNumber">01 / 30</output></header>
<main id="surface"><svg id="graph" viewBox="0 0 640 820" aria-label="Карта интеграции"></svg></main>
<div class="lab-camera"><button id="zoomOut" aria-label="Отдалить">−</button><button id="home" aria-label="Вся карта">⌂</button><button id="zoomIn" aria-label="Приблизить">+</button></div>
<footer class="lab-timeline">
<div id="caseGates" class="lab-gates" aria-live="polite"></div>
<div class="lab-scale"><input id="caseRange" type="range" min="1" max="30" value="1" step="1" aria-label="Вариант интеграции"><div id="casePoints" class="lab-points"></div></div>
</footer>
<script type="module" src="/src/dev/integration.ts"></script>
</body>
</html>
