# Install as /etc/systemd/system/forma-postfix.service.d/forma-journal.conf.
# Kept outside the generated Postfix unit so regeneration preserves the hook.
[Unit]
After=forma-journal.service
Wants=forma-journal.service

[Service]
ExecStopPost=-/usr/bin/python3 /opt/forma/current/server/python/system_journal.py stop --component postfix_service --writer /var/log/forma/run/services.sock
